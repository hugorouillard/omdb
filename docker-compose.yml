services:
  omdb:
    build: .
    ports:
      - "${APP_PORT:-8400}:80"
    environment:
      DATABASE_HOST: db
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DEBUG: "true"
      DEVELOPMENT_SESSION_TOKEN: omdb-local-moonpoint
      PUBLIC_URL: "http://localhost:${APP_PORT:-8400}"
    volumes:
      - .:/var/www/html
    depends_on:
      db-seed:
        condition: service_completed_successfully

  db-seed:
    image: mysql:8.4.11
    environment:
      MYSQL_PWD: root
    command: ["sh", "/seed-dev-db.sh"]
    volumes:
      - ./docker/dev-fixtures.sql:/fixtures/dev-fixtures.sql:ro
      - ./docker/seed-dev-db.sh:/seed-dev-db.sh:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4.11
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: omdb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./docker/dev-fixtures.sql:/docker-entrypoint-initdb.d/90-dev-fixtures.sql:ro

volumes:
  db:
